.cse-make24 {
  /* Shared palette with the main menu */
  --m24-title-color: #fff0be;
  --m24-title-outline: #303b34;
  --m24-title-font: 'Lora', Georgia, 'Palatino Linotype', serif;
  --m24-body-font: 'Poppins', 'Trebuchet MS', Candara, sans-serif;
  --m24-panel-color: #d0c29ff0;
  --m24-frame-color: #b99c67;
  --m24-button-color: #755638;
  --m24-button-hover-color: #826440;
  --m24-button-text-color: #ffffff;
  --m24-focus-color: #fff3b8;

  /* Minigame-specific */
  --m24-topbar-center: 9.5%; /* Map button, title and stats share this center line */
  --m24-ink: #45321f;
  --m24-ink-soft: #6d5438;
  --m24-card: #f7eed4;
  --m24-card-edge: #8a6a43;
  --m24-gold: #e2b24a;
  --m24-good: #4f7a3a;
  --m24-warn: #a2412f;

  position: relative;
  isolation: isolate;
  container-type: inline-size;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  color: var(--m24-ink);
  font-family: var(--m24-body-font);
  /* Candle-lit classroom fallback when no backgroundSrc is given */
  background:
    radial-gradient(38% 52% at 9% 34%, #f6a23f38, transparent 70%),
    radial-gradient(34% 48% at 92% 28%, #f6a23f30, transparent 70%),
    radial-gradient(70% 45% at 50% 0%, #3c4d4433, transparent 70%),
    linear-gradient(#2f2a2b, #1f1b1b);
}
.cse-make24, .cse-make24 * { box-sizing: border-box; }
.cse-make24 [hidden] { display: none !important; }

.cse-make24 button {
  font-family: var(--m24-body-font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.cse-make24 button:focus-visible {
  outline: .22cqw solid var(--m24-focus-color);
  outline-offset: .18cqw;
}
.cse-make24 button:disabled { cursor: default; }

.cse-make24__background {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; pointer-events: none; user-select: none; z-index: -2;
}
.cse-make24__vignette {
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(75% 70% at 50% 55%, transparent 40%, #0d0a0899 100%);
}

/* ---- top bar ---------------------------------------------------------- */
.cse-make24__title {
  /* Same look as the main menu's "Math Nightmare" title, a bit smaller. */
  position: absolute; top: var(--m24-topbar-center); left: 50%; transform: translate(-50%, -50%);
  margin: 0; white-space: nowrap;
  color: var(--m24-title-color);
  font-family: var(--m24-title-font);
  font-size: 4.9cqw; font-weight: 700; line-height: 1; letter-spacing: .04cqw;
  -webkit-text-stroke: .14cqw var(--m24-title-outline);
  paint-order: stroke fill;

<script>
(() => {
/**
 * Make 24 — pure game logic (no DOM).
 *
 * Exact fraction arithmetic so puzzles like 3 3 8 8  ->  8 ÷ (3 − 8 ÷ 3) work
 * without floating-point errors, a solver used for puzzle generation and hints,
 * and a random puzzle generator that only returns solvable puzzles.
 */
const OPS = ['+', '-', '*', '/'];
const OP_SYMBOL = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const OP_NAME = { '+': 'plus', '-': 'minus', '*': 'times', '/': 'divided by' };
const DIFFICULTIES = {
    // Numbers 1–9, always solvable without fractions or negatives.
    easy: { label: 'Easy', maxNumber: 9, wholeNumbersOnly: true },
    // Numbers 1–10, any solvable puzzle.
    normal: { label: 'Normal', maxNumber: 10, wholeNumbersOnly: false },
    // Numbers 1–13 (a full deck of cards), any solvable puzzle.
    hard: { label: 'Hard', maxNumber: 13, wholeNumbersOnly: false },
};
/* ------------------------------------------------------------------ */
/* Fractions                                                           */
/* ------------------------------------------------------------------ */
function gcd(a, b) {
    while (b)
        [a, b] = [b, a % b];
    return a;
}
class Fraction {
    constructor(num, den = 1) {
        if (!Number.isInteger(num) || !Number.isInteger(den))
            throw new TypeError('Fraction parts must be integers');
        if (den === 0)
            throw new RangeError('Denominator cannot be zero');
        if (den < 0) {
            num = -num;
            den = -den;
        }
        const g = gcd(Math.abs(num), den) || 1;
        this.num = num / g + 0; // "+ 0" turns -0 into 0
        this.den = den / g;
    }
    add(o) { return new Fraction(this.num * o.den + o.num * this.den, this.den * o.den); }
    sub(o) { return new Fraction(this.num * o.den - o.num * this.den, this.den * o.den); }
    mul(o) { return new Fraction(this.num * o.num, this.den * o.den); }
    div(o) { return new Fraction(this.num * o.den, this.den * o.num); }
    isZero() { return this.num === 0; }
    isInteger() { return this.den === 1; }
    isNegative() { return this.num < 0; }
    equals(o) {
        const f = typeof o === 'number' ? new Fraction(o) : o;
        return this.num === f.num && this.den === f.den;
    }
    /** Plain-text form using a real minus sign: "24", "8/3", "−5". */
    toString() {
        const sign = this.num < 0 ? '−' : '';
        const n = Math.abs(this.num);
        return this.den === 1 ? `${sign}${n}` : `${sign}${n}/${this.den}`;
    }
}
/** Returns null for division by zero. */
function applyOp(a, op, b) {
    switch (op) {
        case '+': return a.add(b);
        case '-': return a.sub(b);
        case '*': return a.mul(b);
        case '/': return b.isZero() ? null : a.div(b);
    }
}
const PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };
function atom(value) {
    if (value.isNegative())
        return { value, text: value.toString(), prec: 0 };
    // A fraction card like 8/3 behaves like a division when it sits inside a bigger expression.
    return { value, text: value.toString(), prec: value.isInteger() ? 3 : 2 };
}
function joinTerms(left, op, right, value) {
    const p = PREC[op];
    const l = left.prec < p ? `(${left.text})` : left.text;
    const needsRight = right.prec < p || (right.prec === p && (op === '-' || op === '/'));
    const r = needsRight ? `(${right.text})` : right.text;
    return { value, text: `${l} ${OP_SYMBOL[op]} ${r}`, prec: p };
}
function stepText(s) {
    return `${s.left} ${OP_SYMBOL[s.op]} ${s.right} = ${s.result}`;
}
function search(terms, steps, target, mode) {
    if (terms.length === 1)
        return terms[0].value.equals(target) ? { expression: terms[0].text, steps } : null;
    for (let i = 0; i < terms.length; i++) {
        for (let j = i + 1; j < terms.length; j++) {
            const a = terms[i];
            const b = terms[j];
            const rest = terms.filter((_, k) => k !== i && k !== j);
            // Ordered so friendlier operations are tried first.
            const tries = [[a, '+', b], [a, '*', b], [a, '-', b], [b, '-', a], [a, '/', b], [b, '/', a]];
            for (const [l, op, r] of tries) {
                const v = applyOp(l.value, op, r.value);
                if (!v)
                    continue;
                if (mode !== 'any' && v.isNegative())
                    continue;
                if (mode === 'whole' && !v.isInteger())
                    continue;
                const found = search([...rest, joinTerms(l, op, r, v)], [...steps, { left: l.value, op, right: r.value, result: v }], target, mode);
                if (found)
                    return found;
            }
        }
    }
    return null;
}
/**
 * Finds a solution, preferring the friendliest kind: whole numbers only, then no
 * negatives, then anything. Works on any number of values (used for mid-game hints).
 */
function findSolution(values, target = 24, opts = {}) {
    const t = new Fraction(target);
    const terms = values.map((v) => atom(typeof v === 'number' ? new Fraction(v) : v));
    const modes = opts.wholeNumbersOnly ? ['whole'] : ['whole', 'nonNegative', 'any'];
    for (const mode of modes) {
        const s = search(terms, [], t, mode);
        if (s)
            return s;
    }
    return null;
}
function isSolvable(numbers, target = 24, opts = {}) {
    return findSolution(numbers, target, opts) !== null;
}
/* ------------------------------------------------------------------ */
/* Puzzle generation                                                   */
/* ------------------------------------------------------------------ */
/** Order-independent key, e.g. [8, 3, 8, 3] -> "3,3,8,8". */
function puzzleKey(numbers) {
    return [...numbers].sort((a, b) => a - b).join(',');
}
function generatePuzzle(difficulty = 'normal', opts = {}) {
    const { maxNumber, wholeNumbersOnly } = DIFFICULTIES[difficulty];
    const target = opts.target ?? 24;
    const rng = opts.rng ?? Math.random;
    const avoid = new Set(opts.avoid ?? []);
    const roll = () => 1 + Math.floor(rng() * maxNumber);
    for (let attempt = 0; attempt < 2000; attempt++) {
        const nums = [roll(), roll(), roll(), roll()];
        if (avoid.has(puzzleKey(nums)))
            continue;
        if (isSolvable(nums, target, { wholeNumbersOnly }))
            return nums;
    }
    // Practically unreachable for target 24; a safe fallback for unusual targets.
    if (target === 24)
        return [1, 2, 3, 4];
    throw new Error(`Could not generate a ${difficulty} puzzle for target ${target}`);
}

/**
 * Make 24 minigame — UI component for Math Nightmare.
 *
 *   import { mountMake24 } from './make24.js';
 *   const game = mountMake24(document.querySelector('#scene')!, {
 *     difficulty: 'normal',
 *     onSolve: (result) => monster.takeDamage(10),
 *     onExit: () => showMap(),
 *   });
 *   // later: game.destroy();
 *
 * Also link make24.css. All class names are prefixed `cse-make24` so nothing
 * leaks into the host game.
 */
/** Default coins per solve. */
const DEFAULT_COIN_REWARD = { easy: 5, normal: 10, hard: 15 };
const C = 'cse-make24';
function mountMake24(host, options = {}) {
    const target = options.target ?? 24;
    const keyboard = options.keyboard ?? true;
    let difficulty = options.difficulty ?? 'normal';
    // ---- state ---------------------------------------------------------
    let numbers = [];
    let cards = [];
    let steps = [];
    let history = [];
    let selectedId = null;
    let pendingOp = null;
    let freshId = null;
    let nextId = 1;
    let solved = false;
    let coins = Math.max(0, Math.floor(options.coins ?? 0));
    let startedAt = 0;
    let frozenMs = 0;
    let solvedCount = 0;
    let streak = 0;
    let lastKey = '';
    // ---- markup --------------------------------------------------------
    const root = document.createElement('section');
    root.className = C;
    root.setAttribute('aria-label', `Make ${target} minigame`);
    root.innerHTML = `
    ${options.backgroundSrc ? `<img class="${C}__background" alt="" draggable="false">` : ''}
    <div class="${C}__vignette" aria-hidden="true"></div>
    <button type="button" class="${C}__exit" data-action="exit" hidden>
      <span aria-hidden="true">‹</span> <span class="${C}__exit-label"></span>
    </button>
    <h2 class="${C}__title"></h2>
    <div class="${C}__stats">
      <div class="${C}__stat ${C}__stat--coins"><span>Coins</span><b><i class="${C}__coin" aria-hidden="true"></i><span data-stat="coins">0</span></b></div>
      <div class="${C}__stat"><span>Solved</span><b data-stat="solved">0</b></div>
      <div class="${C}__stat"><span>Streak</span><b data-stat="streak">0</b></div>
      <div class="${C}__stat"><span>Time</span><b data-stat="time">0:00</b></div>
    </div>
    <div class="${C}__panel">
      <div class="${C}__header">
        <p class="${C}__prompt">Use all four numbers once with + − × ÷ to make <b>${target}</b>.</p>
        <div class="${C}__difficulty" role="group" aria-label="Difficulty">
          ${Object.keys(DIFFICULTIES).map((d) => `<button type="button" data-difficulty="${d}">${DIFFICULTIES[d].label}</button>`).join('')}
        </div>
      </div>
      <div class="${C}__cards" role="group" aria-label="Number cards"></div>
      <div class="${C}__ops" role="group" aria-label="Operations">
        ${OPS.map((op) => `<button type="button" class="${C}__op" data-op="${op}" aria-label="${OP_NAME[op]}">${OP_SYMBOL[op]}</button>`).join('')}
      </div>
      <ol class="${C}__log" aria-label="Your steps"></ol>
      <p class="${C}__feedback" role="status" aria-live="polite"></p>
      <div class="${C}__actions">
        <button type="button" data-action="undo">Undo</button>
        <button type="button" data-action="reset">Reset</button>
        <button type="button" data-action="skip">New puzzle</button>
      </div>
    </div>
    <div class="${C}__overlay" hidden>
      <div class="${C}__result" role="dialog" aria-modal="true" aria-labelledby="${C}-result-title">
        <h3 id="${C}-result-title" class="${C}__result-title">${target}!</h3>
        <p class="${C}__result-expr"></p>
        <p class="${C}__result-coins"><i class="${C}__coin" aria-hidden="true"></i><span></span></p>
        <p class="${C}__result-meta"></p>
        <div class="${C}__result-actions">
          <button type="button" class="${C}__primary" data-action="next">Next puzzle</button>
          <button type="button" class="${C}__secondary" data-action="exit" hidden></button>
        </div>
      </div>
    </div>`;
    const $ = (sel) => root.querySelector(sel);
    const cardsEl = $(`.${C}__cards`);
    const logEl = $(`.${C}__log`);
    const feedbackEl = $(`.${C}__feedback`);
    const overlayEl = $(`.${C}__overlay`);
    const statEls = {
        coins: $('[data-stat="coins"]'),
        solved: $('[data-stat="solved"]'),
        streak: $('[data-stat="streak"]'),
        time: $('[data-stat="time"]'),
    };
    const bg = root.querySelector(`.${C}__background`);
    if (bg && options.backgroundSrc)
        bg.src = options.backgroundSrc;
    const titleEl = $(`.${C}__title`);
    titleEl.textContent = options.title ?? `Make ${target}`;
    if (options.onExit) {
        const label = options.exitLabel ?? 'Map';
        root.querySelectorAll('[data-action="exit"]').forEach((b) => { b.hidden = false; });
        $(`.${C}__exit-label`).textContent = label;
        $(`.${C}__result-actions [data-action="exit"]`).textContent = `Back to ${label.toLowerCase()}`;
    }
    if (options.showDifficulty === false)
        $(`.${C}__difficulty`).hidden = true;
    host.appendChild(root);
    // ---- helpers -------------------------------------------------------
    const elapsed = () => (solved ? frozenMs : Date.now() - startedAt);
    const fmtTime = (ms) => {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    };
    const cardById = (id) => cards.find((c) => c.id === id);
    function valueHTML(f) {
        const sign = f.isNegative() ? '−' : '';
        const n = Math.abs(f.num);
        if (f.isInteger()) {
            const text = `${sign}${n}`;
            return `<span class="${C}__int" data-len="${Math.min(text.length, 5)}">${text}</span>`;
        }
        return `${sign ? `<span class="${C}__sign">${sign}</span>` : ''}` +
            `<span class="${C}__frac"><span>${n}</span><span>${f.den}</span></span>`;
    }
    function spokenValue(f) {
        const sign = f.isNegative() ? 'negative ' : '';
        return f.isInteger() ? `${sign}${Math.abs(f.num)}` : `${sign}${Math.abs(f.num)} over ${f.den}`;
    }
    function setFeedback(text, tone = 'info') {
        feedbackEl.textContent = text;
        feedbackEl.dataset.tone = tone;
    }
    // ---- rendering -----------------------------------------------------
    function renderCards() {
        const hadFocus = cardsEl.contains(document.activeElement);
        const single = cards.length === 1 ? cards[0] : null;
        let html = '';
        for (let slot = 0; slot < 4; slot++) {
            const card = cards.find((c) => c.slot === slot);
            if (!card) {
                html += `<div class="${C}__slot" aria-hidden="true"></div>`;
                continue;
            }
            const classes = [`${C}__card`];
            if (card.id === selectedId)
                classes.push('is-selected');
            if (card.id === freshId)
                classes.push('is-fresh');
            if (single === card)
                classes.push(card.term.value.equals(target) ? 'is-win' : 'is-wrong');
            html += `<button type="button" class="${classes.join(' ')}" data-card="${card.id}"
        aria-pressed="${card.id === selectedId}" aria-label="Number ${spokenValue(card.term.value)}"
        ${solved ? 'disabled' : ''}><span class="${C}__key" aria-hidden="true">${slot + 1}</span>${valueHTML(card.term.value)}</button>`;
        }
        cardsEl.innerHTML = html;
        if (hadFocus) {
            const focusId = selectedId ?? cards[0]?.id;
            cardsEl.querySelector(`[data-card="${focusId}"]`)?.focus();
        }
    }
    function renderControls() {
        root.querySelectorAll('[data-op]').forEach((b) => {
            const op = b.dataset.op;
            b.disabled = solved || selectedId === null || cards.length < 2;
            b.setAttribute('aria-pressed', String(op === pendingOp));
            b.classList.toggle('is-selected', op === pendingOp);
        });
        root.querySelectorAll('[data-difficulty]').forEach((b) => {
            b.setAttribute('aria-pressed', String(b.dataset.difficulty === difficulty));
        });
        $('[data-action="undo"]').disabled = solved || history.length === 0;
        $('[data-action="reset"]').disabled = solved || history.length === 0;
    }
    function renderLog() {
        logEl.innerHTML = steps.length
            ? steps.map((s) => `<li>${stepText(s)}</li>`).join('')
            : `<li class="${C}__log-empty">Pick a number, an operation, then another number.</li>`;
    }
    function renderStats() {
        statEls.coins.textContent = String(coins);
        statEls.solved.textContent = String(solvedCount);
        statEls.streak.textContent = String(streak);
        statEls.time.textContent = fmtTime(elapsed());
    }
    function render() {
        renderCards();
        renderControls();
        renderLog();
        renderStats();
    }
    // ---- game actions --------------------------------------------------
    function startPuzzle(nums) {
        if (nums) {
            if (nums.length !== 4 || nums.some((n) => !Number.isInteger(n) || n < 1)) {
                throw new RangeError('Make 24 needs exactly four positive whole numbers');
            }
            if (!findSolution(nums, target))
                console.warn(`[make24] ${nums.join(' ')} has no solution for ${target}`);
        }
        numbers = nums ? [...nums] : generatePuzzle(difficulty, { target, avoid: lastKey ? [lastKey] : [] });
        lastKey = puzzleKey(numbers);
        cards = numbers.map((n, slot) => ({ id: nextId++, slot, term: atom(new Fraction(n)) }));
        steps = [];
        history = [];
        selectedId = null;
        pendingOp = null;
        freshId = null;
        solved = false;
        startedAt = Date.now();
        overlayEl.hidden = true;
        render();
    }
    function pickCard(id) {
        if (solved || !cardById(id))
            return;
        freshId = null;
        if (selectedId === id) {
            selectedId = null;
            pendingOp = null;
        }
        else if (selectedId !== null && pendingOp !== null) {
            combine(selectedId, pendingOp, id);
            return;
        }
        else {
            selectedId = id;
        }
        render();
    }
    function pickOp(op) {
        if (solved)
            return;
        if (selectedId === null) {
            setFeedback('Pick a number first.');
            return;
        }
        pendingOp = pendingOp === op ? null : op;
        render();
    }
    function combine(leftId, op, rightId) {
        const left = cardById(leftId);
        const right = cardById(rightId);
        const value = applyOp(left.term.value, op, right.term.value);
        if (!value) {
            pendingOp = null;
            setFeedback("You can't divide by zero. Try another operation.", 'warn');
            render();
            return;
        }
        history.push({ cards, steps });
        const merged = { id: nextId++, slot: right.slot, term: joinTerms(left.term, op, right.term, value) };
        cards = cards.filter((c) => c !== left && c !== right).concat(merged).sort((a, b) => a.slot - b.slot);
        steps = [...steps, { left: left.term.value, op, right: right.term.value, result: value }];
        pendingOp = null;
        freshId = merged.id;
        // Keep the result selected so the player can chain the next step.
        selectedId = cards.length > 1 ? merged.id : null;
        if (cards.length === 1) {
            if (value.equals(target)) {
                win(merged);
                return;
            }
            setFeedback(`That makes ${value}, not ${target}. Undo a step or reset.`, 'warn');
        }
        else {
            setFeedback('');
        }
        render();
    }
    function win(finalCard) {
        solved = true;
        frozenMs = Date.now() - startedAt;
        solvedCount++;
        streak++;
        const reward = options.coinReward ?? DEFAULT_COIN_REWARD[difficulty];
        const raw = typeof reward === 'function' ? reward({ difficulty, timeMs: frozenMs, streak }) : reward;
        const coinsEarned = Math.max(0, Math.floor(Number(raw) || 0));
        coins += coinsEarned;
        setFeedback(`${finalCard.term.text} = ${target}`, 'good');
        render();
        bumpCoins();
        const result = {
            numbers: [...numbers], target, difficulty,
            expression: finalCard.term.text, steps: [...steps],
            timeMs: frozenMs, coinsEarned, totalCoins: coins,
        };
        $(`.${C}__result-expr`).textContent = `${result.expression} = ${target}`;
        const coinLine = $(`.${C}__result-coins`);
        coinLine.hidden = coinsEarned === 0;
        coinLine.querySelector('span').textContent = `+${coinsEarned} coin${coinsEarned === 1 ? '' : 's'}`;
        $(`.${C}__result-meta`).textContent = `Time ${fmtTime(frozenMs)} · Streak ${streak}`;
        window.setTimeout(() => {
            if (!solved || !root.isConnected)
                return;
            overlayEl.hidden = false;
            $('[data-action="next"]').focus();
        }, 650);
        options.onSolve?.(result);
    }
    function undo() {
        const prev = history.pop();
        if (!prev || solved)
            return;
        cards = prev.cards;
        steps = prev.steps;
        selectedId = null;
        pendingOp = null;
        freshId = null;
        setFeedback('');
        render();
    }
    function reset() {
        if (!history.length || solved)
            return;
        const first = history[0];
        history = [];
        cards = first.cards;
        steps = first.steps;
        selectedId = null;
        pendingOp = null;
        freshId = null;
        setFeedback('');
        render();
    }
    /** Little bounce on the coin counter when coins are added. */
    function bumpCoins() {
        const stat = statEls.coins.closest(`.${C}__stat`);
        stat.classList.remove('is-bumped');
        void stat.offsetWidth; // restart the animation
        stat.classList.add('is-bumped');
    }
    function skip() {
        const wasSolved = solved;
        const answer = wasSolved ? null : findSolution(numbers, target);
        if (!wasSolved) {
            streak = 0;
            options.onSkip?.([...numbers]);
        }
        startPuzzle();
        if (answer)
            setFeedback(`Last one: ${answer.expression} = ${target}`, 'info');
        else
            setFeedback('');
    }
    // ---- events --------------------------------------------------------
    root.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || btn.disabled || !root.contains(btn))
            return;
        const { card, op, action, difficulty: d } = btn.dataset;
        if (card)
            pickCard(Number(card));
        else if (op)
            pickOp(op);
        else if (d)
            controller.setDifficulty(d);
        else if (action === 'undo')
            undo();
        else if (action === 'reset')
            reset();
        else if (action === 'skip' || action === 'next')
            skip();
        else if (action === 'exit')
            options.onExit?.();
    });
    const KEY_OPS = { '+': '+', '-': '-', '*': '*', x: '*', X: '*', '/': '/' };
    const onKey = (e) => {
        if (root.getClientRects().length === 0)
            return; // game is hidden
        if (e.ctrlKey || e.metaKey || e.altKey)
            return;
        if (e.target?.closest?.('input, textarea, select, [contenteditable="true"]'))
            return;
        let handled = true;
        if (!overlayEl.hidden) {
            if (e.key === 'n' || e.key === 'N')
                skip();
            else if (e.key === 'Escape' && options.onExit)
                options.onExit();
            else
                handled = false;
        }
        else if (/^[1-4]$/.test(e.key)) {
            const card = cards.find((c) => c.slot === Number(e.key) - 1);
            if (card)
                pickCard(card.id);
        }
        else if (KEY_OPS[e.key])
            pickOp(KEY_OPS[e.key]);
        else if (e.key === 'Backspace' || e.key === 'u' || e.key === 'U')
            undo();
        else if (e.key === 'r' || e.key === 'R')
            reset();
        else if (e.key === 'n' || e.key === 'N')
            skip();
        else if (e.key === 'Escape') {
            selectedId = null;
            pendingOp = null;
            render();
        }
        else
            handled = false;
        if (handled)
            e.preventDefault();
    };
    if (keyboard)
        document.addEventListener('keydown', onKey);
    const timer = window.setInterval(() => { if (!solved)
        statEls.time.textContent = fmtTime(elapsed()); }, 500);
    const controller = {
        element: root,
        newPuzzle(nums) { setFeedback(''); startPuzzle(nums); },
        setDifficulty(d) {
            if (!DIFFICULTIES[d])
                throw new RangeError(`Unknown difficulty: ${d}`);
            if (d === difficulty)
                return;
            difficulty = d;
            setFeedback('');
            startPuzzle();
        },
        getCoins: () => coins,
        setCoins(n) {
            coins = Math.max(0, Math.floor(n));
            renderStats();
        },
        destroy() {
            window.clearInterval(timer);
            document.removeEventListener('keydown', onKey);
            root.remove();
        },
    };
    startPuzzle(options.numbers);
    return controller;
}



  const game = mountMake24(document.getElementById('scene'), {
    difficulty: 'normal',
    coins: 0,                                    // player's current balance
    // coinReward: ({ streak }) => 10 + streak,  // optional custom payout
    // backgroundSrc: 'assets/classroom.png',   // same background as the main menu
    onSolve: (result) => console.log(`Solved! +${result.coinsEarned} coins (total ${result.totalCoins})`, result),
    onSkip: (numbers) => console.log('Skipped', numbers),
    onExit: () => alert('Back to the map (hook this up to the map screen).'),
  });
  window.make24 = game; // handy for testing in the console: make24.newPuzzle([3, 3, 8, 8])
})();
</script>
</body>
